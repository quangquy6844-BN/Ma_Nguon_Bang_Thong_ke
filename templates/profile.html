{% extends 'index.html' %}

{% block title %}Thông tin cửa hàng · Sổ doanh thu{% endblock %}

{% block content %}
<div class="mb-4">
  <p class="eyebrow">CẤU HÌNH BILL</p>
  <h1 class="h2 fw-bold">Thông tin cửa hàng</h1>
  <p class="text-secondary">
    Thông tin này sẽ được hiển thị trên bill in ra.
  </p>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Tên hộ kinh doanh / cửa hàng</label>
        <input
          name="shop_name"
          class="form-control"
          value="{{ user.shop_name }}"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Địa chỉ kinh doanh</label>
        <input
          name="address"
          class="form-control"
          value="{{ user.address }}"
        >
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Mã số thuế</label>
          <input
            name="tax_code"
            class="form-control"
            value="{{ user.tax_code }}"
          >
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Ngành nghề</label>
          <input
            name="business"
            class="form-control"
            value="{{ user.business }}"
          >
        </div>
      </div>

      <button class="btn btn-primary">Lưu thông tin</button>
    </form>
  </div>
</div>
{% endblock %}
